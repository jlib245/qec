code:
  name: "surface_code"
  distance: 3
  rounds: 3

noise:
  p_gate: 0.002
  p_meas: 0.01
  p_corr: 0.0

training:
  data_mode: "online"
  train_steps: 5000
  val_steps: 1000
  chunk_size: 1000
  epochs: 10
  batch_size: 256
  seed: 42
  num_workers: 0
  prefetch_factor: 2
  pin_memory: false
  optimizer:
    name: "Adam"
    kwargs:
      lr: 0.001
  criterion:
    name: "bce_with_logits"
    kwargs: {}
  output_dir: "./results/pauli_plus_soft_iq_quick"
  early_stopping:
    patience: 5

model:
  name: "jung_cnn_low_soft"
  kwargs: {}

decoder:
  name: "neural_decoder"
  weight_path: ""
  model_kwargs: {}

simulation:
  shots: 1000
  backend: "pauli_plus"
  pauli_plus:
    p: [0.001, 0.002, 0.005]
    cz_dephasing_leakage: [0.0, 2.0e-4]
    heating_rate_per_us: 0.001429
    passive_decay_T1_us: 20.0
    leakage_removal_after_reset: true
    data_qubit_leakage_removal_per_cycle: true
    snr: 10.0
    t_meas_over_T1: 0.01
    p_crosstalk: 9.5e-4
    crosstalk_alpha: 0.25
    crosstalk_leakage_rate: 0.0
