code:
  name: "surface_code"
  distance: 5
  rounds: 5

noise: {p_gate: 0.001, p_meas: 0.005, p_corr: 0.0}

training:
  data_mode: "online"
  epochs: 1
  batch_size: 256
  output_dir: "./results/mwpm_d5_no_ct"
  optimizer: {name: "Adam", kwargs: {lr: 0.001}}
  criterion: {name: "bce_with_logits", kwargs: {}}
  early_stopping: {patience: 10}

model: {name: "jung_cnn_low_soft", kwargs: {}}
decoder: {name: "mwpm", weight_path: "", model_kwargs: {}}

simulation:
  shots: 1000
  backend: "pauli_plus"
  pauli_plus:
    p: 0.001
    cz_dephasing_leakage: 2.0e-4
    heating_rate_per_us: 0.001429
    passive_decay_T1_us: 20.0
    leakage_removal_after_reset: true
    data_qubit_leakage_removal_per_cycle: true
    snr: 10.0
    t_meas_over_T1: 0.01
    p_crosstalk: 0.0
    crosstalk_alpha: 0.25
    crosstalk_leakage_rate: 0.0
