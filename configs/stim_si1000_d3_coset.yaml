code:
  name: "surface_code_si1000"
  distance: 3
  rounds: 3

noise:
  p_gate: 0.002
  p_meas: 0.0
  p_corr: 0.0

training:
  data_mode: "online"
  train_steps: 20000
  val_steps: 2000
  chunk_size: 1000
  epochs: 50
  batch_size: 256
  seed: 42
  num_workers: 0
  prefetch_factor: 2
  pin_memory: false
  optimizer: {name: "Adam", kwargs: {lr: 0.001}}
  criterion: {name: "cross_entropy", kwargs: {}}
  output_dir: "./results/stim_si1000_d3_coset"
  early_stopping: {patience: 10}

model:
  name: "jung_cnn_low"
  coset_mode: true
  kwargs: {}

decoder:
  name: "neural_decoder"
  weight_path: ""
  model_kwargs: {}

simulation:
  shots: 1000
  backend: "stim"
