code:
  name: "surface_code"
  distance: 5
  rounds: 5

# pauli_plus backend에서는 noise 섹션을 simulation.pauli_plus에서 설정
noise:
  p_gate: 0.002
  p_meas: 0.01
  p_corr: 0.0

training:
  data_mode: "online"
  train_steps: 20000
  val_steps: 2000
  chunk_size: 1000
  epochs: 50
  batch_size: 256
  seed: 42
  num_workers: 0
  prefetch_factor: 2
  pin_memory: false
  optimizer:
    name: "Adam"
    kwargs:
      lr: 0.001
  criterion:
    name: "cross_entropy"
    kwargs: {}
  output_dir: "./results/pauli_plus_soft_iq_d5_coset"
  early_stopping:
    patience: 10

model:
  name: "jung_cnn_low_soft"   # REQUIRED_PREPROCESSOR = "soft_grid"
  coset_mode: true
  kwargs: {}

decoder:
  name: "neural_decoder"
  weight_path: ""
  model_kwargs: {}

simulation:
  shots: 1000
  backend: "pauli_plus"
  pauli_plus:
    p: 0.002
    # Leakage (Phase 2)
    cz_dephasing_leakage: 2.0e-4
    heating_rate_per_us: 0.001429   # 1/700
    passive_decay_T1_us: 20.0
    leakage_removal_after_reset: true
    data_qubit_leakage_removal_per_cycle: true
    # IQ noise (Phase 2) — soft measurement 활성화
    snr: 10.0
    t_meas_over_T1: 0.01
    # Crosstalk (Phase 3)
    p_crosstalk: 9.5e-4
    crosstalk_alpha: 0.25
    crosstalk_leakage_rate: 0.0
