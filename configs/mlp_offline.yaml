code:
  distance: 5
  rounds: 5
  name: surface_code
noise:
  p_gate:
  - 0.006
  - 0.007
  - 0.008
  - 0.009
  - 0.01
  - 0.011
  - 0.012
  - 0.013
  - 0.014
  - 0.015
  p_meas: 0.0001
  p_corr: 0.001
training:
  data_mode: offline
  train_path: datasets/d5_complex_noise/train.npz
  val_path: datasets/d5_complex_noise/val.npz
  train_steps: 5000000
  val_steps: 50000
  batch_size: 2048
  chunk_size: 100000
  epochs: 50
  output_dir: results/mlp_experiment_offline
  optimizer:
    name: AdamW
    kwargs:
      lr: 0.001
      weight_decay: 0.01
  criterion:
    name: bce_with_logits
    kwargs:
      reduction: mean
  scheduler:
    name: ReduceLROnPlateau
    kwargs:
      mode: min
      factor: 0.5
      patience: 3
  early_stopping:
    patience: 20
model:
  name: mlp
  kwargs:
    hidden_dim: 512
simulation:
  shots: 100000
  backend: stim
decoder:
  name: neural_decoder
  weight_path: results/mlp_experiment_offline/best_model.pth
  model_kwargs:
    model_name: mlp
