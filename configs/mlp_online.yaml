code:
  distance: 5
  rounds: 5
  name: surface_code
noise:
  p_gate:
  - 0.001
  - 0.005
  - 0.01
  p_meas: 0.005
  p_corr:
  - 0.001
  - 0.002
simulation:
  shots: 1000000
  backend: stim
training:
  data_mode: online
  batch_size: 2048
  chunk_size: 100000
  train_steps: 2000000
  val_steps: 50000
  epochs: 50
  output_dir: results/mlp_experiment_online
  optimizer:
    name: AdamW
    kwargs:
      lr: 0.001
      weight_decay: 0.01
  scheduler:
    name: ReduceLROnPlateau
    kwargs:
      mode: min
      factor: 0.5
      patience: 3
  early_stopping:
    patience: 15
model:
  name: mlp
  kwargs:
    hidden_dim: 512
decoder:
  name: neural_decoder
