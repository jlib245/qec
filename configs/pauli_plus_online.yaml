code:
  name: "surface_code"
  distance: 3
  rounds: 3

# pauli_plus backend에서는 noise 섹션 대신 simulation.pauli_plus에서 설정
noise:
  p_gate: 0.002
  p_meas: 0.01
  p_corr: 0.0
  p_leak: 0.0

training:
  data_mode: "online"
  train_steps: 10000
  val_steps: 2000
  chunk_size: 1000
  epochs: 50
  batch_size: 256
  seed: 42
  num_workers: 0
  prefetch_factor: 2
  pin_memory: false
  optimizer:
    name: "Adam"
    kwargs:
      lr: 0.001
  criterion:
    name: "bce_with_logits"
    kwargs: {}
  output_dir: "./results/pauli_plus_test"
  early_stopping:
    patience: 10

model:
  name: "jung_cnn_low"
  use_erasures: false
  kwargs: {}

decoder:
  name: "neural_decoder"
  weight_path: ""
  model_kwargs: {}

simulation:
  shots: 1000
  backend: "pauli_plus"
  pauli_plus:
    p: 0.002
    cz_dephasing_leakage: 0.0
    heating_rate_per_us: 0.0
