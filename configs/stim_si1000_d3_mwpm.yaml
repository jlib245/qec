code:
  name: "surface_code_si1000"
  distance: 3
  rounds: 3

noise:
  p_gate: [0.001, 0.002, 0.005]
  p_meas: 0.0
  p_corr: 0.0

training:
  data_mode: "online"
  epochs: 1
  batch_size: 256
  output_dir: "./results/stim_si1000_d3_mwpm"
  optimizer: {name: "Adam", kwargs: {lr: 0.001}}
  criterion: {name: "bce_with_logits", kwargs: {}}
  early_stopping: {patience: 10}

model: {name: "jung_cnn_low", kwargs: {}}

decoder:
  name: "mwpm"
  weight_path: ""
  model_kwargs: {}

simulation:
  shots: 1000
  backend: "stim"
