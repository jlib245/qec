code:
  name: "surface_code"
  distance: 5
  rounds: 5

noise:
  p_gate: 0.002
  p_meas: 0.01
  p_corr: 0.0

training:
  data_mode: "offline"
  train_path: "/dev/shm/pp_d5/train.npz"
  val_path: "/dev/shm/pp_d5/val.npz"
  chunk_size: 10000   # gen 모드에서 시뮬 호출당 샘플 수 (tqdm 업데이트 단위)
  epochs: 100
  batch_size: 4096
  seed: 42
  num_workers: 0
  prefetch_factor: 2
  pin_memory: true
  optimizer:
    name: "Adam"
    kwargs:
      lr: 0.001
  criterion:
    name: "bce_with_logits"
    kwargs: {}
  output_dir: "./results/pauli_plus_soft_iq_d5_offline"
  early_stopping:
    patience: 99999

model:
  name: "jung_cnn_low_soft"
  kwargs: {}

decoder:
  name: "neural_decoder"
  weight_path: ""
  model_kwargs: {}

simulation:
  shots: 1000
  backend: "pauli_plus"
  pauli_plus:
    p: 0.002
    cz_dephasing_leakage: 2.0e-4
    heating_rate_per_us: 0.001429
    passive_decay_T1_us: 20.0
    leakage_removal_after_reset: true
    data_qubit_leakage_removal_per_cycle: true
    snr: 10.0
    t_meas_over_T1: 0.01
    p_crosstalk: 9.5e-4
    crosstalk_alpha: 0.25
    crosstalk_leakage_rate: 0.0
