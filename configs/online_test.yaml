# configs/online_test.yaml
# 온라인 학습 테스트: CNN vs MWPM 공정 비교용
code:
  name: "surface_code"
  distance: 5
  rounds: 5

noise:
  p_gate: [0.007, 0.008, 0.009, 0.010, 0.011, 0.012, 0.013, 0.014, 0.015]
  p_meas: 0.001
  p_corr: 0.0

training:
  data_mode: "online"
  train_steps: 500000
  val_steps: 45000
  chunk_size: 10000
  epochs: 50
  batch_size: 1024
  seed: 42
  num_workers: 4
  prefetch_factor: 2
  pin_memory: true

  optimizer:
    name: "Adam"
    kwargs:
      lr: 0.001
  criterion:
    name: "bce_with_logits"
    kwargs: {}
  output_dir: "./results/online_test"
  early_stopping:
    patience: 15
  scheduler:
    name: "ReduceLROnPlateau"
    kwargs:
      mode: "min"
      factor: 0.5
      patience: 2

model:
  name: "jung_cnn_low"
  kwargs: {}

decoder:
  name: "neural_decoder"
  weight_path: ""
  model_kwargs: {}

simulation:
  shots: 10000
