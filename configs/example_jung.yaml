code:
  name: surface_code
  distance: 5
  rounds: 5
noise:
  p_gate:
  - 0.007
  - 0.008
  - 0.009
  - 0.01
  - 0.011
  - 0.012
  - 0.013
  - 0.014
  - 0.015
  p_meas: 0.001
  p_corr: 0.0
training:
  data_mode: offline
  train_path: datasets/jung/train.npz
  val_path: datasets/jung/val.npz
  train_steps: 10000
  val_steps: 2000
  epochs: 50
  batch_size: 1024
  chunk_size: 50000
  seed: 42
  num_workers: 4
  prefetch_factor: 2
  pin_memory: true
  optimizer:
    name: Adam
    kwargs:
      lr: 0.001
  criterion:
    name: bce_with_logits
    kwargs: {}
  output_dir: ./results/experiment
  early_stopping:
    patience: 15
  scheduler:
    name: ReduceLROnPlateau
    kwargs:
      mode: min
      factor: 0.5
      patience: 2
model:
  name: jung_cnn_low
  kwargs: {}
decoder:
  name: neural_decoder
  weight_path: ''
  model_kwargs: {}
simulation:
  shots: 100000
  backend: stim
